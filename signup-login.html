<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />

  <title>Sign Up / Log In | Pathway AI — Chicago State University</title>

  <meta
    name="description"
    content="Sign up or log in to Pathway AI to start your journey to financial wellness, campus resources, and opportunities at Chicago State University."
  />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Existing global styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Sign up / Log in page styles -->
  <link rel="stylesheet" href="signup-login.css" />
</head>

<body>

  <div class="auth-page">

    <!-- =====================================================
         BRAND PANEL
    ====================================================== -->

    <div class="auth-brand-panel">

      <div class="auth-brand-photo" aria-hidden="true">
        <img src="images/csu-campus.jpg" alt="" />
        <div class="auth-brand-photo-fade"></div>
      </div>

      <div class="auth-brand-content">

        <a href="/" class="auth-logo">PATHWAY AI</a>

        <div class="auth-brand-copy">
          <h1 id="brand-heading">Create Your Account</h1>
          <p id="brand-copy">Start your journey to financial wellness and success.</p>

          <ul class="auth-feature-list">
            <li>
              <span class="auth-feature-icon" aria-hidden="true"></span>
              Track your financial wellness
            </li>
            <li>
              <span class="auth-feature-icon" aria-hidden="true"></span>
              Discover opportunities
            </li>
            <li>
              <span class="auth-feature-icon" aria-hidden="true"></span>
              Access campus resources
            </li>
            <li>
              <span class="auth-feature-icon" aria-hidden="true"></span>
              Get personalized guidance
            </li>
          </ul>
        </div>

        <p class="auth-switch">
          <span id="switch-question">Already have an account?</span>
          <button type="button" class="auth-switch-btn" id="mode-toggle" aria-label="Switch to log in">
            <span id="switch-label">Sign in here</span>
            <svg class="switch-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="M13 6l6 6-6 6"></path>
            </svg>
          </button>
        </p>

      </div>
    </div>


    <!-- =====================================================
         FORM PANEL
    ====================================================== -->

    <div class="auth-form-panel">
      <div class="auth-form-wrap">

        <h2 id="form-heading">Let's get started!</h2>

        <form class="auth-form" id="signup-form" novalidate>

          <div class="form-field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" required />
          </div>

          <div class="form-field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@csu.edu" autocomplete="email" required />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="password" name="password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.5 6.6C3.4 8.5 1.5 12 1.5 12s3.5 7 10.5 7c1.3 0 2.5-.2 3.6-.6"></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-input-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.5 6.6C3.4 8.5 1.5 12 1.5 12s3.5 7 10.5 7c1.3 0 2.5-.2 3.6-.6"></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <label class="auth-checkbox">
            <input type="checkbox" id="agree" name="agree" required />
            <span>I agree to the <a href="/terms.html">Terms of Use</a> and <a href="/privacy.html">Privacy Policy</a>.</span>
          </label>

          <button type="submit" class="btn btn-primary btn-full btn-large">Create Account</button>

        </form>

        <form class="auth-form is-hidden" id="login-form" novalidate>

          <div class="form-field">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" name="loginEmail" placeholder="name@csu.edu" autocomplete="email" />
          </div>

          <div class="form-field">
            <label for="loginPassword">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password" />
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.5 6.6C3.4 8.5 1.5 12 1.5 12s3.5 7 10.5 7c1.3 0 2.5-.2 3.6-.6"></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-form-row">
            <label class="auth-checkbox inline">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="/forgot-password.html" class="auth-forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-large">Log In</button>

        </form>

        <div class="auth-divider"><span id="divider-label">Sign up with</span></div>

        <div class="auth-oauth-row">

          <button type="button" class="oauth-btn">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path fill="#4285F4" d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.79h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.89-1.74 2.99-4.3 2.99-7.31z"/>
              <path fill="#34A853" d="M10 20c2.7 0 4.96-.89 6.62-2.42l-3.23-2.5c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.76-5.59-4.12H1.07v2.59A10 10 0 0 0 10 20z"/>
              <path fill="#FBBC05" d="M4.41 11.92A6 6 0 0 1 4.09 10c0-.67.12-1.32.32-1.92V5.49H1.07A10 10 0 0 0 0 10c0 1.61.39 3.14 1.07 4.51z"/>
              <path fill="#EA4335" d="M10 3.96c1.47 0 2.79.51 3.82 1.5l2.87-2.87C14.95.99 12.7 0 10 0 6.09 0 2.72 2.24 1.07 5.49l3.34 2.59C5.2 5.72 7.4 3.96 10 3.96z"/>
            </svg>
            Google
          </button>

          <button type="button" class="oauth-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2l8 3.5V11c0 5-3.4 8.6-8 9.9C7.4 19.6 4 16 4 11V5.5L12 2z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
            CSU Single Sign-On
          </button>

        </div>

      </div>
    </div>

  </div>

  <script src="signup-login.js"></script>

</body>
</html>
